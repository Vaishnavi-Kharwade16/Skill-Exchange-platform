<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Register — SkillSwap</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="d-flex align-items-center" style="min-height:100vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card p-4 shadow-sm">
          <h4 class="mb-3">Create your account</h4>
          <form id="registerPageForm">
            <div class="mb-2">
              <input id="regName" class="form-control" type="text" placeholder="Full name" required>
            </div>
            <div class="mb-2">
              <input id="regEmail" class="form-control" type="email" placeholder="Email" required>
            </div>
            <div class="mb-3">
              <input id="regPwd" class="form-control" type="password" placeholder="Password" required>
            </div>
            <button class="btn btn-primary w-100">Register</button>
          </form>
          <p class="small text-center mt-3">Already a member? <a href="login.html">Login</a></p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
