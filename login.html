<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — SkillSwap</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="d-flex align-items-center" style="min-height:100vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card p-4 shadow-sm">
          <h4 class="mb-3">Welcome Back</h4>
          <form id="loginPageForm">
            <div class="mb-2">
              <input id="loginEmail" class="form-control" type="email" placeholder="Email" required>
            </div>
            <div class="mb-3">
              <input id="loginPwd" class="form-control" type="password" placeholder="Password" required>
            </div>
            <div class="d-flex justify-content-between align-items-center">
              <button class="btn btn-primary">Login</button>
              <a href="register.html">Create account</a>
            </div>
          </form>
        </div>
        <p class="text-muted text-center mt-3 small">Or login using demo accounts seeded in the prototype</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
